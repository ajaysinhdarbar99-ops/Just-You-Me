<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For You</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#ffd6e6;overflow:hidden;font-family:"Press Start 2P",monospace}
.screen{position:fixed;inset:0;display:none;overflow:hidden;background:#ffd6e6}
.screen.on{display:block;animation:fi .6s ease both}
@keyframes fi{from{opacity:0}to{opacity:1}}
.bg{background:url("assets/bg.jpg") center/cover no-repeat}
.tap{position:absolute;left:0;right:0;bottom:2.5vh;text-align:center;color:#fff;font-size:11px;text-shadow:2px 2px 0 #ff7aa8;animation:blink 1.2s steps(2,end) infinite;pointer-events:none;z-index:5}
@keyframes blink{50%{opacity:.3}}
.music{position:fixed;top:12px;right:12px;z-index:20;width:44px;height:44px;padding:0;border:3px solid #fff;background:#ff9fc4;color:#fff;font-size:22px;line-height:1;box-shadow:0 0 0 3px #ff7aa8;cursor:pointer}

/* heart */
#heart{background:#000}
#cv{display:block;width:100vw;height:100vh}
#heart .tap{color:#fff}
#nextBtn{position:absolute;left:50%;bottom:9vh;transform:translateX(-50%);width:64px;height:64px;padding:0;border:4px solid #fff;background:#e11d48;color:#fff;font-family:"Press Start 2P",monospace;font-size:22px;box-shadow:0 0 0 4px #7a1019;cursor:pointer;z-index:6;display:none}

/* text box */
.box{position:absolute;left:50%;top:7vh;transform:translateX(-50%);width:min(92vw,600px);box-sizing:border-box;padding:18px 20px 24px;background:#ff9fc4;border:4px solid #fff;box-shadow:0 0 0 4px #ff7aa8,0 0 0 8px #fff,0 0 0 12px #ff7aa8}
.ttl{margin:0 0 12px;color:#fff;font-size:clamp(11px,3vw,14px);line-height:1.6;text-align:center;text-shadow:2px 2px 0 #ff7aa8}
.txt{margin:0;min-height:6.5em;color:#fff;font-family:"Pixelify Sans","Press Start 2P",monospace;font-weight:500;font-size:clamp(15px,4.2vw,19px);line-height:1.5;text-shadow:1px 1px 0 #ff7aa8;white-space:pre-wrap;word-break:break-word}

/* pictures at bottom */
.pic{position:absolute;left:50%;bottom:6vh;transform:translateX(-50%);height:52vh;max-width:92vw;object-fit:contain;image-rendering:pixelated}
.pic.enter{animation:pop .45s steps(4,end)}
@keyframes pop{from{transform:translate(-50%,12px) scale(.92)}to{transform:translate(-50%,0) scale(1)}}
#sChar{height:60vh;bottom:4vh}

/* poster */
#ptitle{position:absolute;left:0;right:0;top:5vh;text-align:center;color:#fff;line-height:1.35;text-shadow:3px 3px 0 #ff7aa8,-3px -3px 0 #ff7aa8,3px -3px 0 #ff7aa8,-3px 3px 0 #ff7aa8}
.l1{font-size:8vw;white-space:nowrap}
.l2{font-size:11vw;margin-top:2vh;padding-left:40%;text-align:left;white-space:nowrap}
.ch{display:inline-block;opacity:0;animation:li .5s steps(4,end) forwards,wv 1.6s ease-in-out infinite}
.sp{display:inline-block;width:.5em}
@keyframes li{0%{opacity:0;transform:translateY(-4vh) scale(1.6)}100%{opacity:1;transform:none}}
@keyframes wv{0%,100%{transform:translateY(0)}50%{transform:translateY(-1vh)}}
#phug{position:absolute;left:50%;bottom:4vh;transform:translateX(-50%);height:46vh;max-width:94vw;object-fit:contain;image-rendering:pixelated;opacity:0;animation:fo .8s steps(6,end) 1.4s forwards}
@keyframes fo{to{opacity:1}}

/* kiss */
#kissImg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:70vh;max-width:92vw;object-fit:contain;image-rendering:pixelated}
#mwah{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-size:clamp(34px,12vw,110px);white-space:nowrap;text-shadow:4px 4px 0 #ff7aa8,-4px -4px 0 #ff7aa8,4px -4px 0 #ff7aa8,-4px 4px 0 #ff7aa8;opacity:0;animation:mw .8s steps(5,end) 1s forwards}
@keyframes mw{to{opacity:1}}

/* last */
#last{background:#0b1226 url("assets/last_terrace.jpg") center/cover no-repeat}
#lastLine{position:absolute;left:0;right:0;top:22%;text-align:center;color:#fff;white-space:nowrap;font-size:clamp(12px,3.9vw,30px);line-height:1.6;text-shadow:3px 3px 0 #d94b7d}
</style>
</head>
<body>

<button class="music" id="music" aria-label="music">♫</button>

<!-- 0 heart -->
<section class="screen" id="heart">
  <canvas id="cv"></canvas>
  <div class="tap" id="heartTap">TAP →</div>
  <button id="nextBtn" aria-label="next">→</button>
</section>

<!-- 1 scene -->
<section class="screen bg" id="scene">
  <img class="pic" id="sChar" src="assets/scene1_excited.png" alt="">
  <div class="box"><p class="txt" id="sTxt"></p></div>
  <div class="tap">TAP →</div>
</section>

<!-- 2 poster -->
<section class="screen bg" id="poster">
  <div id="ptitle"></div>
  <img id="phug" src="assets/poster_hug.png" alt="">
  <div class="tap">TAP →</div>
</section>

<!-- 3 message 1 -->
<section class="screen bg" id="s3">
  <div class="box"><p class="ttl">HAPPY ANNIVERSARY</p><p class="txt" id="m0"></p></div>
  <img class="pic" src="assets/msg1_mic.png" alt="">
  <div class="tap">TAP →</div>
</section>

<!-- 4 message 2 -->
<section class="screen bg" id="s4">
  <div class="box"><p class="ttl">HAPPY ANNIVERSARY</p><p class="txt" id="m1"></p></div>
  <img class="pic" src="assets/msg2_run.png" alt="">
  <div class="tap">TAP →</div>
</section>

<!-- 5 message 3 -->
<section class="screen bg" id="s5">
  <div class="box"><p class="ttl">HAPPY ANNIVERSARY</p><p class="txt" id="m2"></p></div>
  <img class="pic" src="assets/msg3_tears_hug.png" alt="">
  <div class="tap">TAP →</div>
</section>

<!-- 6 message 4 -->
<section class="screen bg" id="s6">
  <div class="box"><p class="ttl">HAPPY ANNIVERSARY</p><p class="txt" id="m3"></p></div>
  <img class="pic" src="assets/msg4_gift.png" alt="">
  <div class="tap">TAP →</div>
</section>

<!-- 7 kiss -->
<section class="screen bg" id="kiss">
  <img id="kissImg" src="assets/msg5_kiss.png" alt="">
  <div id="mwah">MWAH</div>
  <div class="tap">TAP →</div>
</section>

<!-- 8 last -->
<section class="screen" id="last">
  <div id="lastLine"></div>
  <div class="tap">TAP →</div>
</section>

<script>
(function () {
  const $ = function (id) { return document.getElementById(id); };
  const screens = Array.from(document.querySelectorAll(".screen"));
  const handlers = [];
  const enters = [];
  let cur = 0;

  function show(i) {
    cur = i;
    screens.forEach(function (s, k) { s.classList.toggle("on", k === i); });
    if (enters[i]) enters[i]();
  }
  function next() { if (cur < screens.length - 1) show(cur + 1); }

  // Every tap goes to the handler of the visible screen
  document.addEventListener("pointerdown", function () {
    if (handlers[cur]) handlers[cur]();
  });

  // ---------- Typing: letters appear one by one ----------
  function Typer(el, speed) {
    let timer = null, full = "", k = 0, done = true;
    function finish() {
      if (done) return;
      clearInterval(timer);
      el.textContent = full;
      done = true;
    }
    return {
      start: function (text) {
        clearInterval(timer);
        full = text; k = 0; done = false;
        el.textContent = "";
        timer = setInterval(function () {
          k++;
          el.textContent = full.slice(0, k);
          if (k >= full.length) { clearInterval(timer); done = true; }
        }, speed);
      },
      finish: finish,
      isDone: function () { return done; }
    };
  }

  // ---------- Music made in code ----------
  const AC = window.AudioContext || window.webkitAudioContext;
  let ac = null, master = null, pumpT = null, nt = 0, bar = 0, musicOn = true;
  const BEAT = 60 / 66;
  const CH = [[60, 64, 67, 71], [57, 60, 64, 69], [53, 57, 60, 65], [55, 59, 62, 67]];
  const ARP = [0, 1, 2, 3, 2, 1, 2, 3];
  function hz(n) { return 440 * Math.pow(2, (n - 69) / 12); }

  function tone(f, t, d, v, type) {
    const o = ac.createOscillator();
    const gn = ac.createGain();
    const lp = ac.createBiquadFilter();
    o.type = type;
    o.frequency.value = f;
    lp.type = "lowpass";
    lp.frequency.value = 1500;
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.exponentialRampToValueAtTime(v, t + 0.3);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(lp); lp.connect(gn); gn.connect(master);
    o.start(t);
    o.stop(t + d + 0.1);
  }
  function playBar(t) {
    const c = CH[bar % 4];
    c.forEach(function (n) { tone(hz(n - 12), t, BEAT * 4, 0.03, "sine"); });
    for (let i = 0; i < 8; i++) {
      tone(hz(c[ARP[i]] + 12), t + i * BEAT / 2, BEAT * 0.9, 0.045, "triangle");
    }
    bar++;
  }
  function pump() {
    while (nt < ac.currentTime + 0.4) {
      playBar(nt);
      nt += BEAT * 4;
    }
    pumpT = setTimeout(pump, 120);
  }
  function startMusic() {
    if (!AC) return;
    if (!ac) {
      ac = new AC();
      master = ac.createGain();
      master.gain.value = 0.9;
      master.connect(ac.destination);
    }
    if (ac.state === "suspended") ac.resume();
    if (!pumpT) {
      nt = ac.currentTime + 0.1;
      pump();
    }
  }
  $("music").addEventListener("pointerdown", function (e) {
    e.stopPropagation();
    if (!ac) { startMusic(); $("music").textContent = "♫"; return; }
    musicOn = !musicOn;
    master.gain.setTargetAtTime(musicOn ? 0.9 : 0, ac.currentTime, 0.2);
    $("music").textContent = musicOn ? "♫" : "×";
  });

  // ---------- 0: Heart ----------
  const P = [
    "I love you","Seni seviyorum","Te amo","Je t'aime","사랑해","愛してる","我爱你","मैं तुमसे प्यार करता हूँ","હું તને પ્રેમ કરું છું","Ich liebe dich",
    "Ti amo","Eu te amo","Я тебя люблю","Σ'αγαπώ","Ik hou van jou","Jag älskar dig","Kocham cię","Anh yêu em","Aku cinta kamu","Я тебе кохаю",
    "ฉันรักเธอ","أحبك","אני אוהב אותך","আমি তোমাকে ভালোবাসি","நான் உன்னை காதலிக்கிறேன்","నేను నిన్ను ప్రేమిస్తున్నాను","میں تم سے محبت کرتا ہوں","دوستت دارم","Nakupenda","Mahal kita",
    "Jeg elsker dig","Minä rakastan sinua","Szeretlek","Miluji tě","Te iubesc","Ngiyakuthanda","Mo nifẹ rẹ","እወድሃለሁ","Ես քեզ սիրում եմ","მიყვარხარ",
    "ನಾನು ನಿನ್ನನ್ನು ಪ್ರೀತಿಸುತ್ತೇನೆ","ഞാൻ നിന്നെ സ്നേഹിക്കുന്നു","ਮੈਂ ਤੈਨੂੰ ਪਿਆਰ ਕਰਦਾ ਹਾਂ","मी तुझ्यावर प्रेम करतो","म तिमीलाई माया गर्छु","මම ඔයාට ආදරෙයි","ကျွန်တော် မင်းကို ချစ်တယ်","ខ្ញុំស្រលាញ់អ្នក","ຂ້ອຍຮັກເຈົ້າ","Би чамд хайртай",
    "Мен сени сүйөм","Men seni sevaman","Mən səni sevirəm","Ina sonka","Ihunanya m gị","Ndinokuda","Tiako ianao","Ég elska þig","Ma armastan sind","Es tevi mīlu",
    "Aš tave myliu","Milujem ťa","Ljubim te","Волим те","Обичам те","Të dua","Inħobbok","Is breá liom thú","Dwi'n dy garu di","Maite zaitut",
    "T'estimo","Quérote","Mi amas vin","Aloha wau iā ʻoe","Kei te aroha au ki a koe","Ou te alofa ia te oe","Mwen renmen ou","Aku tresno kowe","Abdi bogoh ka anjeun","Saya cintakan awak",
    "Ez te hez dikim","Ke a o rata","Ndiyakuthanda","Ek is lief vir jou","Ech hunn dech gär","Tha gaol agam ort","Ik hâld fan dy","Те сакам","Ман туро дӯст медорам","Men seni söýýärin",
    "زه تا سره مینه کوم","Gihigugma ko ikaw","איך האב דיך ליב","Ndimakukonda","Ndagukunda","Waan ku jecelahay","Nalingi yo","Me dɔ wo","Bëgg naa la","Qan munanayki"
  ];
  const cv = $("cv");
  const g = cv.getContext("2d");
  const heartTap = $("heartTap");
  const nextBtn = $("nextBtn");
  const N = P.length;
  const GAP = 60, POP = 380, FADE = 260;
  const FIN = (N - 1) * GAP + POP + FADE;
  const SC = [1, 0.75, 0.5, 0.3];
  const pts = P.map(function (text, i) {
    const t = 2 * Math.PI * i / N;
    const hx = 16 * Math.pow(Math.sin(t), 3);
    const hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    const s = SC[i % 4];
    return { text: text, x: hx * s, y: hy * s, s: s, i: i };
  });

  let DPR = 1, W = 0, H = 0, t0 = 0, started = false, done = false;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.floor(W * DPR);
    cv.height = Math.floor(H * DPR);
  }
  window.addEventListener("resize", resize);
  resize();

  function frame(now) {
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.globalAlpha = 1;
    g.shadowBlur = 0;
    g.fillStyle = "#000";
    g.fillRect(0, 0, W, H);
    if (started) {
      const el = now - t0;
      const u = Math.min(W * 0.9 / 34, H * 0.78 / 30);
      const breath = el > FIN ? 1 + 0.012 * Math.sin((el - FIN) / 650) : 1;
      g.textAlign = "center";
      g.textBaseline = "middle";
      pts.forEach(function (p) {
        const age = el - p.i * GAP;
        if (age < 0) return;
        const inPop = age < POP;
        const pop = inPop ? 1 + 0.4 * (1 - age / POP) : 1;
        const m = inPop ? 0 : Math.min(1, (age - POP) / FADE);
        const r = 255;
        const gr = Math.round(255 - 209 * m);
        const b = Math.round(255 - 192 * m);
        const size = Math.max(9, u * 1.3 * (0.65 + 0.35 * p.s) * pop * breath);
        const sx = W / 2 + p.x * u * breath;
        const sy = H / 2 - (p.y + 2) * u * breath;
        g.globalAlpha = Math.min(1, age / 180);
        g.font = "700 " + size + "px 'Noto Sans', 'Noto Sans Devanagari', 'Noto Sans JP', 'Noto Sans KR', 'Noto Sans SC', 'Noto Sans Arabic', 'Noto Sans Thai', sans-serif";
        g.fillStyle = "rgb(" + r + "," + gr + "," + b + ")";
        g.fillText(p.text, sx, sy);
      });
      g.globalAlpha = 1;
      if (!done && el > FIN) {
        done = true;
        nextBtn.style.display = "block";
        heartTap.style.display = "none";
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  enters[0] = function () {
    started = false; done = false; t0 = 0;
    nextBtn.style.display = "none";
    heartTap.style.display = "";
  };
  handlers[0] = function () {
    if (!started) {
      started = true;
      t0 = performance.now();
      heartTap.style.display = "none";
      startMusic();
      return;
    }
    if (!done) { t0 = performance.now() - FIN - 1; return; }   // tap during hearts = show all
    next();
  };

  // ---------- 1: Scene ----------
  (function () {
    const LINES = [
      { t: "Yay my baby is here", img: "assets/scene1_excited.png" },
      { t: "cutie I made something for you", img: "assets/scene2_hearts.png" },
      { t: "Aaj kuchh special hai", img: "assets/scene3_standing.png" }
    ];
    const T = Typer($("sTxt"), 45);
    const charEl = $("sChar");
    let i = 0;
    function showLine(k) {
      charEl.src = LINES[k].img;
      charEl.classList.remove("enter");
      void charEl.offsetWidth;
      charEl.classList.add("enter");
      T.start(LINES[k].t);
    }
    enters[1] = function () { i = 0; showLine(0); };
    handlers[1] = function () {
      if (!T.isDone()) { T.finish(); return; }
      if (i < LINES.length - 1) { i++; showLine(i); }
      else next();
    };
  })();

  // ---------- 2: Poster ----------
  (function () {
    const box = $("ptitle");
    let i = 0;
    box.innerHTML = "";
    ["HAPPY ANNIVERSARY", "BACCHA"].forEach(function (line, li) {
      const d = document.createElement("div");
      d.className = li ? "l2" : "l1";
      Array.from(line).forEach(function (ch) {
        const s = document.createElement("span");
        if (ch === " ") {
          s.className = "sp";
          s.innerHTML = "&nbsp;";
        } else {
          s.className = "ch";
          s.textContent = ch;
          s.style.animationDelay = (i * 0.07) + "s, " + (i * 0.07 + 0.5) + "s";
        }
        d.appendChild(s);
        i++;
      });
      box.appendChild(d);
    });
    handlers[2] = next;
  })();

  // ---------- 3-6: Messages (tap = finish, tap again = next) ----------
  const MSGS = [
    "My love, it's been a year since our Chapter 2.0 started, and looking at it from the other side, it's almost 2 years together. Coming back to you has been amazing. Being with you, the fights, the fun, the jokes, all of it. But one thing was always certain: you won't go away from me, and I won't leave you, because I can't let go of what is mine. Before we even realized it, a whole year has passed, and this time our chapter did not stay incomplete.",
    "I can't even handle one day without you, and I love you so much. I'm just your baby. Only you can handle me, and I don't want anyone else.",
    "I love you so so so much, Annu.",
    "Aapke liye gift hai"
  ];
  MSGS.forEach(function (text, n) {
    const T = Typer($("m" + n), 38);
    const idx = 3 + n;
    enters[idx] = function () { T.start(text); };
    handlers[idx] = function () {
      if (!T.isDone()) T.finish();
      else next();
    };
  });

  // ---------- 7: Kiss ----------
  handlers[7] = next;

  // ---------- 8: Last (tap = replay from start) ----------
  (function () {
    const T = Typer($("lastLine"), 70);
    enters[8] = function () { T.start("FOREVER ANOKHI'S BOY"); };
    handlers[8] = function () {
      if (!T.isDone()) T.finish();
      else show(0);
    };
  })();

  show(0);
})();
</script>
</body>
  </html>
